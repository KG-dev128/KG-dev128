name: Daily Auto Commit

on:
  schedule:
    # Runs every day at 09:00 UTC — change the cron time if you prefer a different time
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          mkdir -p .github/streak
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/streak/last_commit.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/streak/last_commit.txt
          git diff --quiet --cached || git commit -m "chore: daily auto commit to keep streak alive"
          git push